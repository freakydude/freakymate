name: CI

# Every push to main and every pull request: tests, builds and packages for all platforms (artifact "packages-<version>").
# Pull requests get a comment with the download link; every push to main is published as prerelease
# vX.Y.<commits since the last release>, replacing the previous prerelease. Releases: workflow "Release".
# Branches without a pull request: start the workflow manually ("Run workflow").
on:
  push:
    # Only main: a branch push with an open pull request would otherwise run twice (push and pull_request).
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A newer commit replaces the running build, also on main: each prerelease replaces all older ones anyway.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "version=$(bash .github/scripts/version.sh)" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    name: Package and release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: freakymate-*
          path: artifacts
      - name: Pack
        working-directory: artifacts
        run: |
          bash ../.github/scripts/pack-artifacts.sh "v$VERSION"
          for archive in *linux*.zip; do
            unzip -Z -l "$archive"
            unzip -p "$archive" release_info.json | python3 -m json.tool
          done
          for package in *.deb; do
            dpkg-deb --info "$package"
            dpkg-deb --contents "$package"
          done
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ env.VERSION }}
          path: |
            artifacts/*.zip
            artifacts/*.deb
            artifacts/get-freakymate.sh
      - name: Publish prerelease
        # Versions ending in .0 are releases and are only published by the Release workflow.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !endsWith(env.VERSION, '.0')
        run: |
          gh release create "v$VERSION" artifacts/*.zip artifacts/*.deb artifacts/get-freakymate.sh \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "FreakyMate v$VERSION (pre-release)" \
            --notes "Automatic build of main at $GITHUB_SHA, replaced by the next commit on main. Newest functions first, less time in use than a release; use it with care and at your own risk (see the README)."
          for old in $(gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName'); do
            if [ "$old" != "v$VERSION" ]; then gh release delete "$old" --yes --cleanup-tag; fi
          done
      - name: Link preview in pull request
        # Pull requests from forks get a read-only token; the artifact is still listed in the run.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          marker='<!-- preview-packages -->'
          body="$marker
          **Preview build \`$VERSION\`** of this pull request: [download packages]($ARTIFACT_URL) (zips and .deb, GitHub login required).
          Untested preview, use at your own risk."
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
