name: Release

# Deliberate release of main: increases the minor or major number, tags vX.Y.0 and publishes the release.
# Later commits on main count up the patch number again (see .github/scripts/version.sh).
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increase"
        type: choice
        options: [minor, major]
        default: minor

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          echo "version=$(bash .github/scripts/version.sh ${{ inputs.bump }})" | tee -a "$GITHUB_OUTPUT"
          echo "previous=$(bash .github/scripts/version.sh last)" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: freakymate-*
          path: artifacts
      - name: Pack
        working-directory: artifacts
        run: bash ../.github/scripts/pack-artifacts.sh "$TAG"
      - name: Create release
        run: |
          notes_start=()
          if [ -n "$PREVIOUS" ]; then notes_start=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" artifacts/*.zip artifacts/*.deb artifacts/get-freakymate.sh \
            --target "$GITHUB_SHA" \
            --title "FreakyMate $TAG" \
            --generate-notes "${notes_start[@]}" \
            --latest
