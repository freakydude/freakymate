name: Release

# Deliberate release of main: increases the minor or major number, tags vX.Y.0 and publishes the release.
# Later commits on main count up the patch number again (see .github/scripts/version.sh).
# All or nothing: the builds attach their packages to a draft; the first failing job cancels the run, and the draft is
# only published when every build succeeded, otherwise deleted.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to increase"
        type: choice
        options: [minor, major]
        default: minor

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Next version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          echo "version=$(bash .github/scripts/version.sh ${{ inputs.bump }})" | tee -a "$GITHUB_OUTPUT"
          echo "previous=$(bash .github/scripts/version.sh last)" | tee -a "$GITHUB_OUTPUT"

  draft:
    name: Draft release
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.draft.outputs.id }}
    env:
      TAG: v${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: draft
        run: |
          # A draft of an earlier attempt at this version.
          for old in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$old"
          done
          previous=()
          if [ -n "$PREVIOUS" ]; then previous=(-f previous_tag_name="$PREVIOUS"); fi
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" "${previous[@]}" --jq .body)
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -f name="Sailhand $TAG" -f body="$notes" -F draft=true --jq .id)
          echo "id=$id" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: [version, draft]
    # contents: attach to the draft; actions: cancel the run at the first failure.
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release-id: ${{ needs.draft.outputs.id }}
      cancel-on-failure: true
    # Resolved in the environment "android-signing" of the APK job (see build.yml).
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  publish:
    name: Publish release
    needs: [version, draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.draft.outputs.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Publish the draft
        run: |
          bash .github/scripts/attach-to-release.sh "$RELEASE_ID" scripts/get-sailhand.sh
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true > /dev/null

  discard:
    name: Discard the draft
    needs: [draft, publish]
    if: always() && needs.draft.result == 'success' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_ID: ${{ needs.draft.outputs.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
