name: Build

# Reusable: tests, release builds and packages for all target platforms, as artifacts "packages-<target>" and
# "android-apk". With a release id each package is attached to that (draft) release as soon as it is ready.
# The jobs take the token permissions of the calling job: read for pull requests, contents write to attach files, and
# actions write as well to stop a release at the first failure. The workflow "CI" finds failed tests by the job names
# "Format, Clippy, Tests (Linux)" and "Windows tests"; keep them.
on:
  workflow_call:
    inputs:
      version:
        description: "Version baked into the binaries (see .github/scripts/version.sh)"
        type: string
        required: true
      release-id:
        description: "Id of the draft release that gets the packages; empty: artifacts only"
        type: string
        default: ""
      cancel-on-failure:
        description: "The first failing job cancels the whole run (releases are all or nothing)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  FREAKYMATE_VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Format, Clippy, Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System libraries for Slint
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libinput-dev libudev-dev
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy for the release configuration (without dev-mode)
        run: cargo clippy -p freakymate --no-default-features -- -D warnings
      - run: cargo test --workspace
      - name: Android SDK and NDK
        run: bash .github/scripts/setup-android.sh
      - name: Rust target for Android
        run: rustup target add aarch64-linux-android
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk@4.1.2,cargo-deny@0.20.2
      - name: Clippy for Android (arm64)
        run: cargo ndk -t arm64-v8a clippy -p freakymate-android -- -D warnings
      - name: Licenses of dependencies (allow list in deny.toml)
        run: cargo deny check licenses
      - &cancel-on-failure
        name: Cancel the run (release)
        # In the Linux container curl comes with the toolchain step; if that step fails, the run still fails as a whole.
        if: failure() && inputs.cancel-on-failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

  # Tests and release build as separate jobs: in sequence they make Windows the longest job of the run.
  windows-test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace
      - *cancel-on-failure

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build --release -p freakymate --no-default-features --bin freakymate
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-about@0.9.2
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/freakymate.exe dist/
          bash .github/scripts/license-files.sh x86_64-pc-windows-msvc dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: freakymate-x86_64-pc-windows-msvc
          path: dist/
      - *cancel-on-failure

  android:
    name: Android APK
    runs-on: ubuntu-latest
    # Builds from main (pre-releases on push, releases by workflow_dispatch) are the app FreakyMate (flavor prod) and
    # get the keystore from the environment, whose branch rule is main; every other build is FreakyMate Dev (flavor dev,
    # debug key) and never sees a secret. The same condition twice: `environment` cannot read the job's env.
    environment: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'android-signing' || '' }}
    env:
      FLAVOR: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'Prod' || 'Dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK and NDK
        run: bash .github/scripts/setup-android.sh
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Rust target for Android
        run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: aarch64-linux-android
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-ndk@4.1.2
      - name: Build and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Without the secrets (not on main) the prod build stops with a message instead of signing with a debug key.
          if [ -n "$KEYSTORE_BASE64" ]; then
            ANDROID_KEYSTORE=$(mktemp "$RUNNER_TEMP/keystore.XXXXXX")
            export ANDROID_KEYSTORE
            echo "$KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE"
          else
            unset ANDROID_KEYSTORE_PASSWORD
          fi
          (cd android && ./gradlew "assemble${FLAVOR}Release" "-PappVersion=$FREAKYMATE_VERSION")
          rm -f "$ANDROID_KEYSTORE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/*/release/*.apk
      - *cancel-on-failure

  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-22.04
    # Ubuntu 22.04: the oldest maintained system that has everything the kiosk needs (cage, seatd), with glibc 2.35;
    # the binary runs on Ubuntu 22.04/24.04 and Debian Bookworm/Trixie (Armbian included). Debian Bullseye has no cage
    # or seatd. Keep MIN_GLIBC in scripts/install.sh and libc6 in build-deb.sh in step; move on when jammy ends (04/2027).
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            triple: x86_64-linux-gnu
            compiler: gcc
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            triple: aarch64-linux-gnu
            compiler: gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            triple: arm-linux-gnueabihf
            compiler: gcc-arm-linux-gnueabihf
    steps:
      - name: Toolchain and target libraries
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -o pipefail
          apt_get() {
            if ! apt-get -o Acquire::Check-Valid-Until=false "$@" > apt.log 2>&1; then
              tail -n 15 apt.log
              # Last lines as an annotation, so the error is visible without log access.
              echo "::error title=apt-get $1 failed::$(grep -E '^(E|W):' apt.log | tail -n 5 | tr '\n' ' ')"
              exit 1
            fi
          }
          # Ubuntu serves foreign architectures from ports.ubuntu.com; the default sources carry amd64 only.
          if [ "${{ matrix.arch }}" != amd64 ]; then
            sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
            for suite in jammy jammy-updates jammy-security; do
              echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $suite main universe"
            done > /etc/apt/sources.list.d/ports.list
          fi
          dpkg --add-architecture ${{ matrix.arch }}
          apt_get update
          apt_get install -y --no-install-recommends curl ca-certificates git pkg-config build-essential \
            ${{ matrix.compiler }} libfontconfig1-dev:${{ matrix.arch }} libxkbcommon-dev:${{ matrix.arch }} \
            libinput-dev:${{ matrix.arch }} libudev-dev:${{ matrix.arch }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Version, profile and components come from rust-toolchain.toml.
          "$HOME/.cargo/bin/rustup" toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Named after the container: build scripts in the cache are linked against its glibc.
          key: ${{ matrix.target }}-ubuntu-22.04
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-about@0.9.2
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/${{ matrix.triple }}/pkgconfig
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release -p freakymate --no-default-features --bin freakymate --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/freakymate dist/
          cp scripts/install.sh scripts/uninstall.sh scripts/system-dependencies.json scripts/polkit/50-freakymate.rules scripts/udev/70-freakymate-backlight.rules dist/
          bash .github/scripts/license-files.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: freakymate-${{ matrix.target }}
          path: dist/
      - *cancel-on-failure

  package:
    name: Package ${{ matrix.target }}
    needs: [linux, windows]
    # Each target on its own: a failed build leaves the packages of the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-pc-windows-msvc
    env:
      ARTIFACT: freakymate-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ env.ARTIFACT }}
          path: artifacts/${{ env.ARTIFACT }}
      - name: Pack
        working-directory: artifacts
        run: |
          bash ../.github/scripts/pack-artifacts.sh "v$FREAKYMATE_VERSION" "$ARTIFACT"
          if [[ "$ARTIFACT" == *linux* ]]; then
            unzip -Z -l "$ARTIFACT.zip"
            unzip -p "$ARTIFACT.zip" release_info.json | python3 -m json.tool
            dpkg-deb --info ./*.deb
            dpkg-deb --contents ./*.deb
            tar --zstd -tf ./*.pkg.tar.zst
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.target }}
          if-no-files-found: error
          path: |
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.pkg.tar.zst
      - name: Attach to the release draft
        if: inputs.release-id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release-id }}
        run: |
          # Windows has a zip only.
          shopt -s nullglob
          bash .github/scripts/attach-to-release.sh "$RELEASE_ID" artifacts/*.zip artifacts/*.deb artifacts/*.pkg.tar.zst
      - *cancel-on-failure

  attach-apk:
    name: Attach APK
    needs: android
    if: inputs.release-id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-apk
          path: apk
      - name: Attach to the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release-id }}
        run: bash .github/scripts/attach-to-release.sh "$RELEASE_ID" apk/*.apk
      - *cancel-on-failure
