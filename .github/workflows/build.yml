name: Build

# Reusable: tests and release builds for all target platforms; results as artifacts.
on:
  workflow_call:
    inputs:
      version:
        description: "Version baked into the binaries (see .github/scripts/version.sh)"
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FREAKYMATE_VERSION: ${{ inputs.version }}

jobs:
  check:
    name: Format, Clippy, Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System libraries for Slint
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy for the release configuration (without dev-mode)
        run: cargo clippy -p freakymate --no-default-features -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Licenses of dependencies (allow list in deny.toml)
        run: cargo deny check licenses

  # Tests and release build as separate jobs: in sequence they make Windows the longest job of the run.
  windows-test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p freakymate --no-default-features --bin freakymate
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/freakymate.exe dist/
          bash .github/scripts/license-files.sh x86_64-pc-windows-msvc dist
      - uses: actions/upload-artifact@v7
        with:
          name: freakymate-x86_64-pc-windows-msvc
          path: dist/

  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Ubuntu 22.04: the oldest maintained system that has everything the kiosk needs (cage, seatd), with glibc 2.35;
    # the binary runs on Ubuntu 22.04/24.04 and Debian Bookworm/Trixie (Armbian included). Debian Bullseye has no cage
    # or seatd. Keep MIN_GLIBC in scripts/install.sh and libc6 in build-deb.sh in step; move on when jammy ends (04/2027).
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            triple: x86_64-linux-gnu
            compiler: gcc
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            triple: aarch64-linux-gnu
            compiler: gcc-aarch64-linux-gnu
          - target: armv7-unknown-linux-gnueabihf
            arch: armhf
            triple: arm-linux-gnueabihf
            compiler: gcc-arm-linux-gnueabihf
    steps:
      - name: Toolchain and target libraries
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -o pipefail
          apt_get() {
            if ! apt-get -o Acquire::Check-Valid-Until=false "$@" > apt.log 2>&1; then
              tail -n 15 apt.log
              # Last lines as an annotation, so the error is visible without log access.
              echo "::error title=apt-get $1 failed::$(grep -E '^(E|W):' apt.log | tail -n 5 | tr '\n' ' ')"
              exit 1
            fi
          }
          # Ubuntu serves foreign architectures from ports.ubuntu.com; the default sources carry amd64 only.
          if [ "${{ matrix.arch }}" != amd64 ]; then
            sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
            for suite in jammy jammy-updates jammy-security; do
              echo "deb [arch=${{ matrix.arch }}] http://ports.ubuntu.com/ubuntu-ports $suite main universe"
            done > /etc/apt/sources.list.d/ports.list
          fi
          dpkg --add-architecture ${{ matrix.arch }}
          apt_get update
          apt_get install -y --no-install-recommends curl ca-certificates git pkg-config build-essential \
            ${{ matrix.compiler }} libfontconfig1-dev:${{ matrix.arch }} libxkbcommon-dev:${{ matrix.arch }}
      - uses: actions/checkout@v7
      - name: Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          # Named after the container: build scripts in the cache are linked against its glibc.
          key: ${{ matrix.target }}-ubuntu-22.04
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/${{ matrix.triple }}/pkgconfig
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release -p freakymate --no-default-features --bin freakymate --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/freakymate dist/
          cp scripts/install.sh scripts/uninstall.sh scripts/system-dependencies.json scripts/polkit/50-freakymate.rules dist/
          bash .github/scripts/license-files.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: freakymate-${{ matrix.target }}
          path: dist/
