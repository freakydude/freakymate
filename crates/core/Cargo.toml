[package]
name = "freakymate-core"
description = "UI-independent Moonraker client, printer state and settings for freakymate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Development aids that are not shipped: simulated Wi-Fi/Ethernet (`NetworkBackend::Simulated`).
dev-mode = []

[dependencies]
dirs = "7.0.0"
futures-util.workspace = true
image.workspace = true
log.workspace = true
reqwest = { version = "0.13.5", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

# Network management via NetworkManager over D-Bus (pure Rust, no libdbus).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.1.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
fake-moonraker.workspace = true
tempfile = "3.27.0"
