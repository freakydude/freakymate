# Written for Sailhand's tests; no third-party text. It covers patterns seen in common configurations (Klipper's
# sample macros, Voron printers, client macros of mainsail-config, filament macro collections).

[printer]
kinematics: corexy
max_velocity: 300

[stepper_x]
step_pin: PB13
dir_pin: !PB12

# Defaults as literals, one per parameter; the order of the form follows the first use in the template.
[gcode_macro WARM_UP]
description: Heat bed and nozzle
gcode:
  {% set bed = params.BED|default(60)|float %}
  {% set nozzle = params.NOZZLE | default(200) %}
  M140 S{bed}
  M104 S{nozzle}
  ; a comment line inside the template
  M190 S{bed}

# Parameters without a default, in a macro with a trailing comment on the section line.
[gcode_macro MOVE_AWAY]   # trailing comment
gcode:
  G91
  G1 X{params.X} Y{params.Y} F{params.SPEED|default('3000')}
  G90

# A macro without any parameter and with several kinds of commands.
[gcode_macro COOL_DOWN]
gcode:
  M104 S0
  M140 S0

  M107

# `'NAME' in params` tests count as parameters.
[gcode_macro PICK_TOOL]
gcode:
  {% if 'TOOL' in params %}
    T{params.TOOL}
  {% elif 'SLOT' in params %}
    SELECT_SLOT SLOT={params.SLOT}
  {% endif %}
  {% if "FORCE" in params %}
    SET_GCODE_VARIABLE MACRO=PICK_TOOL VARIABLE=forced VALUE=1
  {% endif %}

# `is defined` and `is not defined` tests.
[gcode_macro CHECK_LIMITS]
gcode:
  {% if params.LOW is defined %}
    RESPOND MSG="low {params.LOW}"
  {% endif %}
  {% if params.HIGH is not defined %}
    RESPOND MSG="no high"
  {% endif %}

# Method calls on `params` are no parameters (`get`, `__setitem__`); `params.ONE` is one.
[gcode_macro SWAP_VALUES]
gcode:
  {% set one = params.get('ONE', 1) %}
  {% set _ = params.__setitem__("TWO", params.ONE) %}
  RESPOND MSG="{one} {params.TWO}"

# A default taken from a runtime value gets no placeholder; a later literal default does not change that.
[gcode_macro PAUSE_AT]
variable_layer: 5
variable_call: "PAUSE"
gcode:
  {% set state = printer['gcode_macro PAUSE_AT'] %}
  {% set layer = params.LAYER|default(state.layer)|int %}
  {% set call = params.CALL|default(state.call, True) %}
  {% set speed = params.RATE|default(state.layer)|default(1.0) %}
  RESPOND MSG="{layer} {call} {speed}"

# Parameters passed on as a whole are not visible to a scan of the template: no parameter is found for them.
[gcode_macro load_thing]
gcode:
  {% set extra = params.LEN|default(50) %}
  FEED_THING LEN={extra}{% for key in params %}{' %s=%s' % (key, params[key])}{% endfor %}

# Lower case names with G/M code style; Klipper's commands are not case sensitive.
[gcode_macro m701]
gcode:
  {% set len = params.U|default(40) %}
  {% set len2 = params.L|default(10) %}
  RESPOND MSG="{len} {len2}"

[gcode_macro M702]
gcode:
  RESPOND MSG="{params.L|default(5)} {params.U|default(15)}"

# Macros that replace a command of Klipper are no macros to offer.
[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
description: Replaces the built-in command
gcode:
  PAUSE_BASE
  RESPOND MSG="paused"

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  {% set speed = params.VELOCITY|default(50) %}
  RESUME_BASE VELOCITY={speed}

# A helper with a leading underscore.
[gcode_macro _HIDDEN]
variable_active: False
gcode:
  RESPOND MSG="helper"

# Sections that are no macros.
[delayed_gcode refresh]
initial_duration: 0
gcode:
  RESPOND MSG="tick"

[gcode_button nothing]
pin: PA1
press_gcode:
  RESPOND MSG="pressed"
