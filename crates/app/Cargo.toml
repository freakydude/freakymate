[package]
name = "freakymate"
description = "Touch screen UI for Klipper printers via Moonraker (Rust + Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Local builds include the development aids; release builds use `--no-default-features`.
default = ["dev-mode"]
# Development aids that are not shipped: option `--simulate-network`.
dev-mode = ["freakymate-core/dev-mode"]

[dependencies]
freakymate-core.workspace = true
freakymate-ui.workspace = true
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
clap = { version = "4.6.7", features = ["derive"] }
env_filter = { version = "2.0.0", default-features = false, features = ["std"] }
log.workspace = true
slint = { workspace = true, features = ["std", "compat-1-2"] }
tokio.workspace = true
thiserror.workspace = true

# Desktop and kiosk: winit with FemtoVG on the GPU, the software renderer as the fallback.
[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { workspace = true, features = [
    "backend-winit",
    "unstable-winit-030",
    "renderer-femtovg",
    "renderer-software",
] }

# Android: Slint's android-activity backend, which draws with Skia (winit and FemtoVG are not built there).
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
slint = { workspace = true, features = ["backend-android-activity-06", "renderer-skia"] }

# Fallback for displays without DRM/KMS (`--framebuffer`): a platform of its own draws with Slint's software renderer
# to /dev/fbN (mapped with memmap2, read with ioctls from libc), input comes from libinput.
[target.'cfg(target_os = "linux")'.dependencies]
input = "0.10.0"
libc = "0.2.191"
memmap2 = "0.9.11"

[dev-dependencies]
tempfile = "3.27.0"
# Reads the transparent kiosk cursor back the way winit's cursor loader does.
xcursor = "0.3.11"

[build-dependencies]
embed-resource = "3.0.12"
