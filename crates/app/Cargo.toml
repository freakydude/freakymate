[package]
name = "freakymate"
description = "Touch screen UI for Klipper printers via Moonraker (Rust + Slint)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
# Local builds include the development aids; release builds use `--no-default-features`.
default = ["dev-mode"]
# Development aids that are not shipped: option `--simulate-network`.
dev-mode = ["freakymate-core/dev-mode"]
# Render directly via DRM/KMS without desktop or compositor (Linux only, experimental).
linuxkms = ["slint/backend-linuxkms-noseat"]

[dependencies]
freakymate-core.workspace = true
freakymate-ui.workspace = true
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }
clap = { version = "4.6.7", features = ["derive"] }
env_filter = { version = "2.0.0", default-features = false, features = ["std"] }
log.workspace = true
slint = { workspace = true, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "unstable-winit-030",
    "renderer-femtovg",
    "renderer-software",
] }
tokio.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
# Reads the transparent kiosk cursor back the way winit's cursor loader does.
xcursor = "0.3.11"

[build-dependencies]
embed-resource = "3.0.12"
